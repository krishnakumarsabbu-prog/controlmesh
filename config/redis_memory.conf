# Redis configuration for pure in-memory operation
# Used when launching a standalone Redis process locally.
# In OCP the pod args override these via command-line flags.

# Disable all disk persistence
save ""
appendonly no

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Networking
bind 127.0.0.1
port 6379
timeout 0
tcp-keepalive 300

# Logging
loglevel notice
logfile ""

# Disable background save on error (no point when persistence is off)
stop-writes-on-bgsave-error no
