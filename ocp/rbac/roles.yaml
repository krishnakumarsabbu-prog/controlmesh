apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mq-dev
  namespace: mq-hackathon
rules:
- apiGroups: [""]
  resources: [pods, services]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mq-ops
  namespace: mq-hackathon
rules:
- apiGroups: ["", "apps"]
  resources: [pods, services, deployments, replicasets, configmaps]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mq-readonly
  namespace: mq-hackathon
rules:
- apiGroups: ["", "apps"]
  resources: ["*"]
  verbs: [get, list]
