# Apply BEFORE the QM deployments.
# Replace <base64-strong-password> with:  echo -n 'yourpassword' | base64
apiVersion: v1
kind: Secret
metadata:
  name: mq-admin-creds
  namespace: mq-hackathon
type: Opaque
data:
  # REPLACE with your own base64-encoded password before applying
  password: <base64-strong-password>
