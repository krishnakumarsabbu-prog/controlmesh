# Allow Prometheus to scrape all pods in the namespace on their metrics ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: mq-hackathon
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - port: 8000   # bcl-gateway metrics
      protocol: TCP
    - port: 9090   # prometheus self-scrape
      protocol: TCP
    - port: 9443   # mq REST admin
      protocol: TCP
