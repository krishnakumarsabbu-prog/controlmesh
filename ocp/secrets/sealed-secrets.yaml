# Bitnami Sealed Secrets for GitOps-safe secret management.
# The encryptedData values must be generated using the kubeseal CLI against
# the cluster's public key:
#   kubeseal --fetch-cert > pub-cert.pem
#   echo -n '<plaintext>' | kubeseal --raw --from-file=/dev/stdin \
#     --namespace mq-hackathon --name mq-admin-creds --cert pub-cert.pem
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mq-admin-creds
  namespace: mq-hackathon
spec:
  encryptedData:
    # Replace with output from kubeseal --raw
    password: <sealed-value>
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: redis-creds
  namespace: mq-hackathon
spec:
  encryptedData:
    password: <sealed-value>
